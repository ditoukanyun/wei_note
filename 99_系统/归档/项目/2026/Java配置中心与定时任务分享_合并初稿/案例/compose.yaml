name: java-share

x-app: &app
  image: java-share-demo:1.0.0
  build: .
  restart: unless-stopped
  environment: &app-env
    JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m -Duser.timezone=Asia/Shanghai -Duser.home=/tmp
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders
    SPRING_DATASOURCE_USERNAME: demo
    SPRING_DATASOURCE_PASSWORD: demo-only
    DEMO_NACOS_ADDRESS: nacos:8848
    DEMO_NACOS_NAMESPACE: share-dev
    DEMO_ENVIRONMENT: 开发环境
    DEMO_ZOOKEEPER_ADDRESS: zookeeper:2181
    DEMO_JOB_NAMESPACE: java-share-dev
    DEMO_PEERS: http://app-a:8080,http://app-b:8080,http://app-test:8080
  depends_on:
    postgres: {condition: service_healthy}
    zookeeper: {condition: service_healthy}
    config-init: {condition: service_completed_successfully}

services:
  nacos:
    image: nacos/nacos-server:v2.5.1
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports: ["127.0.0.1:${NACOS_PORT:-8848}:8848"]
    volumes: ["nacos-data:/home/nacos/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  zookeeper:
    image: zookeeper:3.9.3
    environment:
      JVMFLAGS: -Xms64m -Xmx128m
    volumes: ["zk-data:/data", "zk-log:/datalog"]
    healthcheck:
      test: ["CMD", "zkServer.sh", "status"]
      interval: 5s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo-only
      POSTGRES_DB: orders
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/初始化数据库.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./src/main/resources/schema.sql:/opt/demo/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d orders"]
      interval: 3s
      timeout: 3s
      retries: 30

  config-init:
    image: python:3.12-alpine
    environment: {NACOS_URL: "http://nacos:8848"}
    volumes: ["./scripts:/scripts:ro"]
    command: ["python", "/scripts/初始化配置.py"]
    depends_on:
      nacos: {condition: service_healthy}

  app-a:
    <<: *app
    environment:
      <<: *app-env
      DEMO_INSTANCE_ID: 开发实例甲
    ports: ["127.0.0.1:${APP_A_PORT:-8081}:8080"]

  app-b:
    <<: *app
    environment:
      <<: *app-env
      DEMO_INSTANCE_ID: 开发实例乙
    ports: ["127.0.0.1:${APP_B_PORT:-8082}:8080"]

  app-test:
    <<: *app
    environment:
      <<: *app-env
      DEMO_INSTANCE_ID: 测试观察实例
      DEMO_ENVIRONMENT: 测试环境
      DEMO_NACOS_NAMESPACE: share-test
      DEMO_JOB_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders_test
    ports: ["127.0.0.1:${APP_TEST_PORT:-8083}:8080"]

  verify:
    image: python:3.12-alpine
    profiles: [tools]
    volumes: ["./scripts:/scripts:ro"]
    command: ["python", "-u", "/scripts/验证演示.py"]
    environment:
      APP_A_URL: http://app-a:8080
      APP_B_URL: http://app-b:8080
      APP_TEST_URL: http://app-test:8080
      NACOS_URL: http://nacos:8848

volumes:
  nacos-data:
  zk-data:
  zk-log:
  postgres-data:
